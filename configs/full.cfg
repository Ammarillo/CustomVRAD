# =============================================================================
# PathRAD - full parameter sheet
# =============================================================================
#
# Put this on the Hammer VRAD line (keep -game and the map path there, not here):
#   -config "C:\PathRAD\configs\full" -game $gamedir $path\$file
#
# Remove the leading # to turn a flag on. Add # to turn it off.
#
# Do not put these in this file — they belong on the Hammer / command line:
#   -config / -cfg, -game, -vproject, -insert_search_path, -novconfig
#
# Lines starting with # or // are ignored.
# Values shown are starting points, not the only valid numbers.
# The quality block below is on; everything else starts commented out.
#
# =============================================================================


# =============================================================================
# 1) QUALITY / MODE
# =============================================================================
# Pick one primary quality mode.
# -final implies high sky sampling (= -extrasky 16).
# -----------------------------------------------------------------------------

-hdr                         # HDR lightmaps (required for modern GMod)
# -ldr                       # LDR lightmaps (legacy)
# -final                     # High-quality preset (slower; raises sky sampling)
# -fast                      # Low-quality fast bake (preview)
# -fastambient                 # Faster leaf ambient (usually fine with pathtrace)
# -extrasky 16               # Extra sky/ambient samples (often implied by -final)
# -bounce 100                # Classic radiosity bounce count (ignored when -pathtrace succeeds)


# =============================================================================
# 2) THREADING / PROCESS
# =============================================================================
# Runtime / logging only — does not change lighting math.
# -----------------------------------------------------------------------------

# -threads 16                # Worker thread count (default = CPU cores)
# -low                       # Lower process priority
# -verbose                   # Extra logging
# -v                         # Same as -verbose
# -StopOnExit                # Pause console on exit
# -FullMinidumps             # Full crash dumps
# -rederrors                 # Highlight errors in red


# =============================================================================
# 3) STATIC PROPS / DETAIL / TEXTURE SHADOWS
# =============================================================================
# Prop lighting and alpha-shadow behaviour.
# -----------------------------------------------------------------------------

-StaticPropLighting          # Bake lighting onto static props
-StaticPropPolys             # Use prop mesh polys for shadows (not AABB)
# -StaticPropNormals         # Debug: show prop normals instead of lighting
# -OnlyStaticProps           # Bake props only (skip world faces)
# -nossprops                 # Disable prop self-shadowing globally
-textureshadows              # $alphatest cutout + $translucent soft alpha shadows
# -nodetaillight             # Skip detail-prop lighting
# -onlydetail                # Bake detail props only
# With -pathtrace, detail props use the GPU baker (same spp as prop verts).
# -noskyboxrecurse           # No 3D-skybox recursion into world shadows


# =============================================================================
# 4) GPU — OpenCL radiosity gather
# =============================================================================
# Classic bounce only. Ignored for world faces when -pathtrace runs.
# Sky / AO stay on the CPU when -textureshadows is set.
# -----------------------------------------------------------------------------

-gpu                         # OpenCL bounce gather
# -gpu_maxtris 0             # Optional GPU BVH triangle cap (0 = unlimited)
# -gpu_batch 32768           # Rays per OpenCL dispatch (lower = safer / slower)


# =============================================================================
# 5) PATH TRACE (DXR)
# =============================================================================
# Replaces world-face direct light and bounce.
# With -StaticPropLighting, props use the same path tracer.
# World faces use either this or classic radiosity, not both.
# -----------------------------------------------------------------------------

# --- enable / backend --------------------------------------------------------

-pathtrace                   # Path-traced world (+ props) lightmaps
# -dxr                       # Alias for -pathtrace
-pt_gpu                      # DXR RayQuery luxel baker (default when DXR ready)
# -pt_cpu                    # Force CPU SSE path tracer (reference / soft features)
# -pt_device 0               # DXGI adapter index for PathTrace

# --- sample quality ----------------------------------------------------------
# With OIDN, 128–512 spp is usually enough; 1024+ is very heavy even on GPU.

-pt_samples 256              # Samples per luxel (max 4096)
-pt_bounces 6                # Indirect hops after luxel (0 = direct+sky only; max 16)
# -pt_bounces 0              # Direct + sky only (no GI); like classic -bounce 0
-pt_aa 2                     # Luxel footprint AA grid 1..5 (1=off, 2=2x2 … 5=5x5)
-pt_lights 8                 # Power-sample N local lights on bounce>0 (0 = all; sky always all)
-pt_emit_samples 0           # $vrad_emit area NEE samples (0 = all tris; raise if noisy)
-pt_adaptive                 # Extra spp only on high-variance luxels (cavities / indirect)
# -pt_noadaptive             # Uniform spp everywhere
-pt_adaptive_max 1024      # Extra spp cap per noisy luxel (default = -pt_samples)

# --- spectral transport ------------------------------------------------------
# Hero-wavelength CIE; white-balanced so white lights stay white (raw CIE is pink).
-pt_spectral                 # Hero-wavelength spectral (4 λ/path; default ON)
# -pt_nospectral             # Disable spectral; linear RGB path transport

# --- props (overrides; default inherits world spp/bounces) -------------------
# Prop lightmap texels match brush luxels: -pt_samples / -pt_bounces / -pt_lights /
# -pt_aa / adaptive extra spp / crease bias / per-island -pt_denoise.
# Direct shadow rays ignore the prop's own same-facing surface for ~8 luxels
# (tessellation speckle a flat brush does not have). Overhangs still shadow.
# Bounce off props uses the model $basetexture (same as -texbounce on brushes).
# Multi-material lightmapped props are packed per instance (model + $lightmap VMTs).
# Vertex lighting: 8x8 charts per triangle in a 64x64-cell atlas (1-texel inset),
# optional -pt_denoise on each 512x512 page, then closest sample per adj tri -> average.

# -pt_prop_samples 256        # Prop spp (default max(8, pt_samples/4))
# -pt_prop_bounces 6         # Prop indirect hops (default = -pt_bounces)
-pt_prop_vertgrid 8        # >0 = tri atlas + closest gather (0 = old per-vert)

# --- soft shadows / sun ------------------------------------------------------
# Soft shadows work on GPU too (slower with high -pt_softsamples).

# -pt_lightradius 10         # Soft disk radius for light / light_spot (0 = hard)
# -pt_lightpenumbra 5        # Softness growth vs distance
# -pt_softsamples 1024       # Max soft visibility rays per NEE (adaptive)
# -pt_softmode all           # Soft on direct|all path vertices (default: direct = faster)
# -softsun 1.5               # Sun angular extent in degrees (or entity SunSpreadAngle)

# --- colored glass ($vrad_filter*) -------------------------------------------
# VMT on translucent brush panes; pathtrace only. No cost if unused.
#   $vrad_filter 1
#   optional $vrad_filtermap / strength / opacity / thickness
#   Stacked panes blend in Oklab. Two-sided by default; $vrad_filter_onesided 1 = front only.
# (No CLI flag — material-driven.)

# --- roughness / metalness ($vrad_roughness* / $vrad_metalness*) -------------
# Compile-time VMT. Leave them off and the bounce stays diffuse.
#   $vrad_roughness "1"        0 = mirror, 1 = fully rough
#   $vrad_roughnessmap "path"  linear greyscale, R channel (replaces the scalar per texel)
#   $vrad_metalness "1"        0 = dielectric, 1 = metal (omitted = 1)
#   $vrad_metalnessmap "path"  linear greyscale, R channel
#   $vrad_metallic / $vrad_metallicmap are aliases
# A map with a scalar multiplies. Omitting metalness on a roughness material uses 1.
# A mirror is roughness 0 (metalness omitted or 1). Explicit metalness 0 is paint.
# Smooth paint (metalness 0, roughness 0) keeps about 4% sharp reflection.
# Gloss reflects. A reflection that hits the adjacent seam face (within 24
# units) becomes a diffuse bounce so the edge does not speckle. Direct lights
# connect through the surface. Roughness 0 counts the triangle the ray hits.
# Higher roughness widens the beam around that reflection. A miss counts only
# while the bounce angle on the surface is still in the lobe.
# Roughness 1 stays diffuse. GPU baker samples maps on brushes and static
# props. Classic
# radiosity keeps only the diffuse lobe. (No CLI flag — material-driven.)

# --- denoise -----------------------------------------------------------------

-pt_denoise                  # Enable pathtrace denoise
-pt_denoiser oidn            # Denoiser: oidn | optix | sakai (implies -pt_denoise)
# -pt_nodennoise             # Disable PathTrace denoise
# -pt_denoise_strength 1.0   # Blend 0..1 noisy → denoised
# -pt_denoise_radius 8       # Sakai filter radius 1..8 (ignored by OIDN / OptiX)


# =============================================================================
# 6) UNDERWATER LIGHTING
# =============================================================================
# Underwater bake for BSP water (leafWaterData + water VMT $fog* / $vrad_uw_*).
# Optional brush override: water_light_vol (Jerlov / SigmaA / SigmaS / FogEnd).
# -----------------------------------------------------------------------------

-underwater                # Mode A: Beer–Lambert extinction + Kd downwelling
# -uw_volume                   # Mode B: homogeneous free-flight volume PT (implies underwater)
# -uw_off                    # Force-disable underwater medium bake
-uw_maxscatter 32            # Max medium scatter events for -uw_volume (default 8; max 64)


# =============================================================================
# 7) AMBIENT OCCLUSION
# =============================================================================
# Any -ao_* flag also implies -ao.
# Under -pathtrace with GI, the AO multiply is skipped (the path tracer already
# handles occlusion). Use -ao_force if you still want that extra darkening.
# -----------------------------------------------------------------------------

# -ao                        # Enable baked AO
# -ao_force                  # Apply AO multiply even under -pathtrace GI
# -ao_samples 32             # AO ray count
# -ao_distance 64            # AO max distance (world units)
# -ao_strength 0.85          # AO darkening strength 0..1
# -ao_bias 0.25              # AO ray origin bias
# -ao_denoise                # Denoise AO map
# -ao_denoise_radius 1       # AO denoise radius
# -ao_denoise_strength 1.0   # AO denoise blend


# =============================================================================
# 8) RADIOSITY / BOUNCE (classic)
# =============================================================================
# Ignored for world faces when -pathtrace runs.
# Still used if path tracing fails and VRAD falls back, or for non-PT compiles.
# -----------------------------------------------------------------------------

-texbounce                   # Sample $basetexture albedo for colored bounce
-texbounce_clean 0.08        # Kill DXT/JPEG chroma noise on near-greys (Oklab C; 0=off)
# -texbounce_noclean         # Keep raw texture tint (disable clean)
# -coarse                    # Larger lighting patches (chop 8) — faster VisLeafs/bounce
# -adaptivechop              # Finer patch floor under -coarse
# -chop 4                    # Minimum patch size
# -maxchop 64                # Maximum patch size
# -bounce_soft 1.0           # Bounce luxel splat scale (0.5..4; 1 = stock)
-bounce_boost 1.0            # Scale final bounced light (0..16; 1 = stock)
-bounce_chroma 0             # Early-bounce saturation (0=off; classic radiosity only)
# -bounce_chroma 1           # Artistic Oklab sat (pathtrace ignores this)
# -bounce_weld               # Edge-weighted bounce across coplanar seams
# -energy                    # Enclosure-aware cavity damp for bounce
# -noenergy                  # Stock Valve bounce (no cavity damp)
# -valve                     # Alias / stock behaviour hint
# -cavity 0.70               # Cavity damp strength when -energy is on
# -maxtransfer 0             # Cap radiosity transfers (0 = unlimited)


# =============================================================================
# 9) LIGHTMAP SAMPLE / SEAM QUALITY
# =============================================================================
# Edge pull moves samples off adjacent solids (floor/wall dark scallops).
# -----------------------------------------------------------------------------

-edgepull 0.75               # Pull edge samples toward face center (0..1)
# -noedgepull                  # Disable edge pull (overrides -edgepull if both set)
# -nostitch                  # Disable lightmap seam stitching across coplanar splits
# -nobakevolume              # Ignore bake_volume (full map; else per-luxel/vert AABB)
# -centersamples             # Force samples at luxel centers
# -noextra                   # Disable extra sampling
# -debugextra                # Debug extra samples
# -dlightmap                 # Debug lightmap dump aid

# NEVER use -luxeldensity with Hammer scale 2 — values >1 invert
# (e.g. 4 => 0.25 = 4× COARSER). Usual cause of "blocky indoor, outdoor OK".
# After removing it, re-run VBSP once so coarsened texinfo/extents rebuild from VMF.

# -luxeldensity 4            # Luxel density scale (dangerous with Hammer scale 2 — see note)
# -smooth 45                 # Phong smooth threshold (degrees)


# =============================================================================
# 10) SUN / SKY
# =============================================================================
# Prefer entity SunSpreadAngle when you can; -softsun overrides the whole map.
# -----------------------------------------------------------------------------

# -softsun 0                 # Global sun angular extent (degrees); 0 = hard
# -LargeDispSampleRadius     # Larger displacement sample radius for sky


# =============================================================================
# 11) DISPLACEMENTS
# =============================================================================
# -----------------------------------------------------------------------------

# -dispchop 8                # Displacement patch chop size
# -disppatchradius 512       # Displacement patch radius
# -maxdispsamplesize 512     # Max displacement sample size


# =============================================================================
# 12) EXTRA LIGHTS FILE
# =============================================================================
# -----------------------------------------------------------------------------

# -lights "path\to\extra_lights.rad"   # Extra .rad lights file


# =============================================================================
# 13) DEBUG / DUMP (dev only)
# =============================================================================
# Leave these off for normal compiles.
# -----------------------------------------------------------------------------

# -dump                      # Dump lighting debug data
# -dumpnormals               # Dump normals
# -dumptrace                 # Dump traces
# -dumppropmaps              # Dump prop lightmaps
# -loghash                   # Log hash data


# =============================================================================
# 14) MPI (distributed compile)
# =============================================================================
# Rarely used for GMod / Hammer.
# -----------------------------------------------------------------------------

# -mpi                       # Enable MPI distributed compile
# -mpi_ListParams            # List MPI parameters


# =============================================================================
# 15) DEBUG BUILD ONLY
# =============================================================================
# Debug-build only — Release VRAD ignores these.
# -----------------------------------------------------------------------------

# -scale 1.0                 # Global light scale
# -ambient 0 0 0             # Constant ambient add
# -dlight 0                  # Debug dynamic light scale
# -sky 1.0                   # Sky scale
# -notexscale                # Ignore texture scale
# -coring 0                  # Light coring threshold


# =============================================================================
# 16) LAUNCHER / TOOLING
# =============================================================================
# Not bake settings — listed so you know they exist.
# -----------------------------------------------------------------------------

