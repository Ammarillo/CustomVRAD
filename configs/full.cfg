# =============================================================================
# CustomVRAD - full parameter sheet
# =============================================================================
# Hammer VRAD parameters (keep -game / map on the Hammer line):
#   -config "PathToCustomVRAD\configs\full" -game $gamedir $path\$file
#
# HOW TO TOGGLE
#   Uncomment a line (remove leading #) to enable it.
#   Comment a line (add #) to disable it.
#
# Do NOT put these in this file (pass on the Hammer / cmd line instead):
#   -config / -cfg, -game, -vproject, -insert_search_path, -novconfig
#
# Lines starting with # or // are ignored. Values shown are suggested defaults.
# Quality defaults below are enabled; everything else starts commented out.
# =============================================================================


# -----------------------------------------------------------------------------
# QUALITY / MODE
# Pick one primary quality mode. -final implies high sky sampling (= -extrasky 16).
# -----------------------------------------------------------------------------
-hdr
# -ldr
# -final
# -fast
# -fastambient
# -extrasky 16
# -bounce 100


# -----------------------------------------------------------------------------
# THREADING / PROCESS
# -----------------------------------------------------------------------------
# -threads 16
# -low
# -verbose
# -v
# -StopOnExit
# -FullMinidumps
# -rederrors


# -----------------------------------------------------------------------------
# STATIC PROPS / DETAIL / TEXTURE SHADOWS
# -----------------------------------------------------------------------------
-StaticPropLighting
-StaticPropPolys
# -StaticPropNormals
# -OnlyStaticProps
# -nossprops
-textureshadows
# -nodetaillight
# -onlydetail
# -noskyboxrecurse


# -----------------------------------------------------------------------------
# GPU (OpenCL bounce gather)
# Sky/ambient occlusion stays CPU when -textureshadows is set.
# -----------------------------------------------------------------------------
-gpu
# -gpu_maxtris 0
# -gpu_batch 32768


# -----------------------------------------------------------------------------
# PATH TRACE (DXR) - replaces world BuildFacelights + radiosity bounce
# Mutually exclusive with normal radiosity bounce for world faces.
# Leave commented unless you want path-traced lightmaps.
# -----------------------------------------------------------------------------
-pathtrace
# -dxr
-pt_gpu            # DXR RayQuery luxel baker (default); use -pt_cpu for reference CPU path
# -pt_cpu
# With OIDN, 128–512 spp is usually enough; 1024 is very heavy even on GPU.
-pt_samples 256
-pt_bounces 6
-pt_aa 2 
# -pt_lights 8           # power-sample 8 locals/NEE (GPU uses this now; 0 = all)
-pt_emit_samples 0      # $vrad_emit area NEE samples (0=all tris; raise if noisy)
# Soft shadows work on GPU too (harder/slower with high -pt_softsamples).
# Colored glass ($vrad_filter*): VMT on translucent brush panes; pathtrace only.
#   $vrad_filter 1, optional $vrad_filtermap / strength / opacity / thickness
#   Stacked panes blend in Oklab (L0*L1, a0+a1, b0+b1). Strength = Oklab lerp.
#   Two-sided by default. $vrad_filter_onesided 1 = front-face only.
#   CPU + GPU sample filter textures at hit (GPU: Texture2DArray of unique images). No cost if unused.
# -pt_lightradius 10     # soft disk for light/light_spot (0 = hard)
# -pt_lightpenumbra 5    # softness growth with distance
# -pt_softsamples 1024    # max soft rays per NEE (adaptive; lower = faster)
# -pt_softmode all       # direct = soft only at luxel (faster); all = every bounce
# -softsun 1.5         # sun angular extent degrees (needed for sky CHSS)
# -pt_device 0
-pt_denoise            # Denoisers: oidn (Intel RTLightmap) | optix (NVIDIA AI HDR) | sakai (SA2024 statistical)
-pt_denoiser oidn
# -pt_denoise_strength 1.0
# -pt_denoise_radius 3


# -----------------------------------------------------------------------------
# AMBIENT OCCLUSION
# Any -ao_* flag also implies -ao.
# -----------------------------------------------------------------------------
# -ao
# -ao_samples 32
# -ao_distance 64
# -ao_strength 0.85
# -ao_bias 0.25
# -ao_denoise
# -ao_denoise_radius 1
# -ao_denoise_strength 1.0


# -----------------------------------------------------------------------------
# RADIOSITY / BOUNCE (ignored for world faces when -pathtrace succeeds)
# -----------------------------------------------------------------------------
-texbounce
# -coarse
# -adaptivechop
# -chop 4
# -maxchop 64
# -bounce_soft 1.0
-bounce_boost 1.0
-bounce_chroma 1
# -bounce_weld
# -energy
# -noenergy
# -valve
# -cavity 0.70
# -maxtransfer 0


# -----------------------------------------------------------------------------
# LIGHTMAP SAMPLE / SEAM QUALITY
# Edge pull pulls samples off adjacent solids (floor/wall scallops). Keep ON.
# -----------------------------------------------------------------------------
-edgepull 0.75
-noedgepull
# -nostitch
# -centersamples
# -noextra
# -debugextra
# -dlightmap
# NEVER use -luxeldensity with Hammer scale 2 — values >1 invert (4 => 0.25 = 4x COARSER).
# That is the usual cause of "blocky indoor, outdoor OK". After removing it, re-run VBSP
# once so coarsened texinfo/extents from a prior bake are rebuilt from the VMF.
# -luxeldensity 4
# -smooth 45


# -----------------------------------------------------------------------------
# SUN / SKY
# Prefer entity SunSpreadAngle when possible; -softsun is global override.
# -----------------------------------------------------------------------------
# -softsun 0
# -LargeDispSampleRadius


# -----------------------------------------------------------------------------
# DISPLACEMENTS
# -----------------------------------------------------------------------------
# -dispchop 8
# -disppatchradius 512
# -maxdispsamplesize 512


# -----------------------------------------------------------------------------
# EXTRA LIGHTS FILE
# -----------------------------------------------------------------------------
# -lights "path\to\extra_lights.rad"


# -----------------------------------------------------------------------------
# DEBUG / DUMP (dev only - leave off for normal compiles)
# -----------------------------------------------------------------------------
# -dump
# -dumpnormals
# -dumptrace
# -dumppropmaps
# -loghash


# -----------------------------------------------------------------------------
# MPI (distributed compile - rarely used for GMod/Hammer)
# -----------------------------------------------------------------------------
# -mpi
# -mpi_ListParams


# -----------------------------------------------------------------------------
# DEBUG BUILD ONLY (ALLOWDEBUGOPTIONS - ignored / unknown in Release builds)
# -----------------------------------------------------------------------------
# -scale 1.0
# -ambient 0 0 0
# -dlight 0
# -sky 1.0
# -notexscale
# -coring 0


# -----------------------------------------------------------------------------
# LAUNCHER / TOOLING (not bake settings - listed for completeness only)
# -----------------------------------------------------------------------------
# -steam
# -allowdebug
# -novconfig